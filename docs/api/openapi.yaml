openapi: 3.1.0
info:
  title: Jobify Legacy API
  version: 1.0.0
  description: 'Current HTTP contract of the Jobify PHP backend, documented as it behaves today (quirks included), not as it should behave. A
    replacement backend must reproduce this behavior unless a product decision says otherwise.


    ## Evidence labels


    Every operation carries `x-evidence`:

    - `EJECUTADO`: verified with a real HTTP request against the legacy backend running locally (see DUDAS.md for the harness).

    - `LEÍDO`: deduced only from the source code; not exercised (external services that need real credentials, unreachable branches, or responses
    that require a real provider).


    `x-source` points to the route file and line where the action is dispatched.


    ## Routing reality


    `backend/index.php` routes only these prefixes: `/usuario`, `/servicios`, `/chat`, `/review`, `/reserva`, `/pago`. The action is always the
    third URL segment (`Ruta[2]`); there is no router parameter, no trailing-slash normalization and no method override.


    - `/admin/*` is **not routed** (there is no `admin` case), so every admin request returns 404 `Ruta no encontrada`. `backend/src/routes/Admin.php`
    is documented with `x-routed: false` for the future backend.

    - `GET /` returns `{"status":"API funcionando"}`.

    - Any unknown first segment returns 404 `Ruta no encontrada`.

    - `OPTIONS` is answered by nginx with 204 before PHP; without nginx, index.php returns 200 with an empty body.


    ## Response envelopes


    Success (`Response::success`): HTTP status + JSON `{"success":true,"message":string,"data":<object|array|string>,"code":<status>}` and `exit`.

    Error (`Response::error`): HTTP status + `{"success":false,"message":string,"code":<status>}` plus optional `"error":<string>` and `exit`.

    Not found (`Response::notFound`): HTTP 404 + `{"success":false,"message":"Ruta no encontrada","code":404}` and `exit`.


    `Content-Type: application/json` is set once in index.php for every response, including empty ones. There is no `charset` parameter. PHP warnings
    are hidden (`display_errors=0`), so malformed input often produces a fatal error rendered as HTTP 500 with an empty body rather than a JSON
    envelope.


    ## Security model


    There is no authentication, authorization, session, cookie or token check anywhere. Identities (`idUsuario`, `idProveedor`, `idCliente`, `idEmisor`)
    are accepted from the body/query and trusted. Login is a GET with the password in the query string. The MercadoPago OAuth callback puts both
    OAuth tokens in a redirect URL to a hardcoded host (`https://jobifyuy.app/confirm`).


    ## Content types


    Only the endpoints that read `php://input` accept JSON (the three `/pago` PUTs and `/admin/verifyPassword`, `/admin/register`). All other
    write endpoints read `$_POST`/`$_FILES` and therefore require `application/x-www-form-urlencoded` or `multipart/form-data`; sending JSON to
    them silently produces "missing data" errors. Query parameters are read directly from `$_GET` with `?? null` in most places, but a few use
    `$_GET[...]` without `??`, which logs a warning and then fails validation.


    ## CORS and proxy headers [LEÍDO]


    `backend/nginx.conf` reflects the request `Origin` into `Access-Control-Allow-Origin`, allows credentials, and adds security headers. The
    built-in execution harness used for `EJECUTADO` evidence does not run nginx, so CORS headers are absent from recorded responses; they are
    a deployment concern, not an application behavior.

    '
  license:
    name: Proprietary (academic project, no license file in repository)
servers:
- url: http://localhost:8081
  description: Backend container/port (BACKEND_PORT default 8081).
tags:
- name: usuario
  description: 'Registration, GET login, profile and password. Sources: backend/src/routes/Usuario.php -> controller/Usuario.php -> model/Usuario.php.'
- name: servicios
  description: 'Service catalogue, creation/update/delete, favorites, search and Groq-backed IA search. Source: backend/src/routes/Servicio.php.'
- name: chat
  description: 'Threads (Contacta) and messages (Contacta_Mensaje). Source: backend/src/routes/Chat.php.'
- name: review
  description: 'Reviews (Resena + Publica). Source: backend/src/routes/Resena.php.'
- name: reserva
  description: 'Reservations (Contrata). Source: backend/src/routes/Reserva.php.'
- name: pago
  description: 'Payments (Pagos), MercadoPago OAuth/tokens/checkout/refund/capture. Source: backend/src/routes/Pago.php.'
- name: admin
  description: 'Admin route file NOT included by index.php: all these requests return 404 today. Source: backend/src/routes/Admin.php.'
security: []
paths:
  /usuario/login:
    get:
      tags:
      - usuario
      summary: Log in by sending e-mail and password in the query string
      description: 'Reads `$_GET[''email'']` and `$_GET[''password'']` directly (no `?? null`), so a missing key raises an ''Undefined array key''
        warning that is hidden by `display_errors=0`. The password travels in the URL and therefore in access logs, proxies and browser history.
        There is no session, token or cookie: the response only contains the user id, name and avatar. Wrong password and unknown e-mail both
        return HTTP 500 (business errors are not mapped to 4xx). The controller''s ''Usuario no encontrado'' branch is unreachable because `PDO::fetch()`
        returns `false`, not `null`.'
      operationId: usuarioLogin
      x-source: backend/src/routes/Usuario.php:154
      x-evidence: EJECUTADO
      parameters:
      - name: email
        in: query
        required: true
        schema:
          type: string
        description: User e-mail. Required by the effective validation (missing -> 400).
        example: juan@example.com
      - name: password
        in: query
        required: true
        schema:
          type: string
        description: Plain-text password. Required (missing -> 400).
        example: cliente123
      responses:
        '200':
          description: Login exitoso
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/LoginData'
              example:
                success: true
                message: Login exitoso
                data:
                  id: 1
                  nombre: Juan
                  foto_perfil: https://example.com/avatars/juan.png
                code: 200
        '400':
          description: Faltan datos
          content:
            application/json:
              example:
                success: false
                message: Faltan datos
                code: 400
        '405':
          description: Método no permitido
          content:
            application/json:
              example:
                success: false
                message: Método no permitido
                code: 405
        '500':
          description: Wrong password or unknown e-mail (both observed as HTTP 500).
          content:
            application/json:
              example:
                success: false
                message: Credenciales incorrectas
                code: 500
      x-quirks:
      - Q01
      - Q02
      - Q03
  /usuario/register:
    post:
      tags:
      - usuario
      summary: Register a client or a provider
      description: 'Accepts `multipart/form-data` or `application/x-www-form-urlencoded`; values are read from `$_POST`, the avatar from `$_FILES[''foto_perfil'']`.
        `es_proveedor` is truthy for the strings ''true''/''1''. Provider registration additionally requires `nombre_empresa`, `descripcion`,
        `habilidades` and `experiencia`; `titulos` is optional. The avatar is optional: if absent or if Cloudinary fails, a DiceBear URL is stored.
        Provider moderation calls Google Perspective; failures are silently ignored because the result is a JSON string and `isset($string[''error''])`
        is false. When `habilidades` is sent as a plain string (not `habilidades[]`), `implode()` throws an uncaught TypeError and the response
        is HTTP 500 with an empty body. Any controller error is returned as HTTP 500.'
      operationId: usuarioRegister
      x-source: backend/src/routes/Usuario.php:13
      x-evidence: EJECUTADO
      requestBody:
        required: true
        description: '`foto_perfil` is a file; all other fields are normal form fields. Send `habilidades[]` and `titulos[]` with brackets.'
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                nombre:
                  type: string
                apellido:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                fecha_nacimiento:
                  type: string
                  format: date
                telefono:
                  type: string
                foto_perfil:
                  type: string
                  format: binary
                es_proveedor:
                  type: string
                  enum:
                  - 'true'
                  - 'false'
                  - '1'
                  - '0'
                nombre_empresa:
                  type: string
                descripcion:
                  type: string
                habilidades[]:
                  description: Array form `habilidades[]`; a scalar string crashes with a TypeError.
                  oneOf:
                  - type: array
                    items:
                      type: string
                  - type: string
                experiencia:
                  type: string
                titulos[]:
                  description: Array form `titulos[]`.
                  oneOf:
                  - type: array
                    items:
                      type: string
                  - type: string
              required:
              - nombre
              - apellido
              - email
              - password
              - fecha_nacimiento
            example:
              nombre: Luis
              apellido: Sosa
              email: luis@example.com
              password: Clave123!
              fecha_nacimiento: '1990-01-01'
              telefono: '+59899555555'
              es_proveedor: 'true'
              nombre_empresa: Sosa Fix
              descripcion: Electricidad
              experiencia: '3'
              habilidades[]:
              - Electricidad
              titulos[]:
              - Tecnico
          multipart/form-data:
            schema:
              type: object
              properties:
                nombre:
                  type: string
                apellido:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                fecha_nacimiento:
                  type: string
                  format: date
                telefono:
                  type: string
                foto_perfil:
                  type: string
                  format: binary
                es_proveedor:
                  type: string
                  enum:
                  - 'true'
                  - 'false'
                  - '1'
                  - '0'
                nombre_empresa:
                  type: string
                descripcion:
                  type: string
                habilidades[]:
                  description: Array form `habilidades[]`; a scalar string crashes with a TypeError.
                  oneOf:
                  - type: array
                    items:
                      type: string
                  - type: string
                experiencia:
                  type: string
                titulos[]:
                  description: Array form `titulos[]`.
                  oneOf:
                  - type: array
                    items:
                      type: string
                  - type: string
              required:
              - nombre
              - apellido
              - email
              - password
              - fecha_nacimiento
            example:
              nombre: Luis
              apellido: Sosa
              email: luis@example.com
              password: Clave123!
              fecha_nacimiento: '1990-01-01'
              telefono: '+59899555555'
              es_proveedor: 'true'
              nombre_empresa: Sosa Fix
              descripcion: Electricidad
              experiencia: '3'
              habilidades[]:
              - Electricidad
              titulos[]:
              - Tecnico
      responses:
        '201':
          description: Usuario registrado exitosamente
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/RegisterData'
              example:
                success: true
                message: Usuario registrado exitosamente
                data:
                  id: '4'
                code: 200
        '400':
          description: 'One of nombre/apellido/email/password/fecha_nacimiento missing. Other 400s: ''El nombre no puede contener números'', ''El
            apellido no puede contener números'', blacklist message, ''Faltan datos obligatorios para el registro como proveedor''.'
          content:
            application/json:
              example:
                success: false
                message: Faltan datos obligatorios
                code: 400
        '405':
          description: Método no permitido
          content:
            application/json:
              example:
                success: false
                message: Método no permitido
                code: 405
        '500':
          description: Business/DB errors, including duplicate e-mail (raw SQLSTATE text as message) and experience/age incoherence. Also 500
            with an empty body on the string-habilidades TypeError.
          content:
            application/json:
              example:
                success: false
                message: Debes tener al menos 18 años para registrarte
                code: 500
      x-quirks:
      - Q04
      - Q05
      - Q06
      - Q07
      x-needs-mock: true
      x-mock-target: Cloudinary (avatar upload), Google Perspective (moderation)
  /usuario/updateProfile:
    post:
      tags:
      - usuario
      summary: Update a user profile (identity comes from the body)
      description: '`idUsuario` is the only required field and is trusted as-is: there is no authentication, so any caller can update any profile.
        Omitted fields keep their current value. When `es_proveedor` is truthy, `nombre_empresa` or `descripcion` must be present, the provider
        row must exist, and `habilidades`/`titulos` arrays replace the previous rows. Sending `telefono` deletes all previous phone rows and inserts
        the new one. A non-existent `idUsuario` returns ''El usuario debe tener al menos 18 años'' because `fetch()` returns `false`, `new DateTime(null)`
        becomes today, and the computed age is 0.'
      operationId: usuarioUpdateProfile
      x-source: backend/src/routes/Usuario.php:66
      x-evidence: EJECUTADO
      requestBody:
        required: true
        description: ''
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                idUsuario:
                  type: string
                nombre:
                  type: string
                apellido:
                  type: string
                email:
                  type: string
                telefono:
                  type: string
                foto_perfil:
                  type: string
                  format: binary
                es_proveedor:
                  type: string
                nombre_empresa:
                  type: string
                descripcion:
                  type: string
                habilidades[]:
                  type: array
                  items:
                    type: string
                experiencia:
                  type: string
                titulos[]:
                  type: array
                  items:
                    type: string
              required:
              - idUsuario
            example:
              idUsuario: '2'
              nombre: Maria
              apellido: Gomez
              email: maria@example.com
              es_proveedor: 'true'
              nombre_empresa: Gomez Pro
              descripcion: Plomeria
              experiencia: '6'
              habilidades[]:
              - Gas
              - Agua
              titulos[]:
              - Certificado
          multipart/form-data:
            schema:
              type: object
              properties:
                idUsuario:
                  type: string
                nombre:
                  type: string
                apellido:
                  type: string
                email:
                  type: string
                telefono:
                  type: string
                foto_perfil:
                  type: string
                  format: binary
                es_proveedor:
                  type: string
                nombre_empresa:
                  type: string
                descripcion:
                  type: string
                habilidades[]:
                  type: array
                  items:
                    type: string
                experiencia:
                  type: string
                titulos[]:
                  type: array
                  items:
                    type: string
              required:
              - idUsuario
            example:
              idUsuario: '2'
              nombre: Maria
              apellido: Gomez
              email: maria@example.com
              es_proveedor: 'true'
              nombre_empresa: Gomez Pro
              descripcion: Plomeria
              experiencia: '6'
              habilidades[]:
              - Gas
              - Agua
              titulos[]:
              - Certificado
      responses:
        '200':
          description: Perfil actualizado exitosamente
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/UpdateProfileData'
              example:
                success: true
                message: Perfil actualizado exitosamente
                data:
                  success: true
                  mensaje: Perfil actualizado correctamente
                code: 200
        '400':
          description: Also 400 for digits in nombre/apellido, blacklist text, or missing provider fields ('Para actualizar un proveedor, debe
            proporcionar al menos nombre de empresa o descripción').
          content:
            application/json:
              example:
                success: false
                message: Falta el ID de usuario
                code: 400
        '405':
          description: Método no permitido
          content:
            application/json:
              example:
                success: false
                message: Método no permitido
                code: 405
        '500':
          description: 'Business errors are 500: non-existent id yields the age message; provider update failure; moderation; Cloudinary failure.'
          content:
            application/json:
              example:
                success: false
                message: El usuario no es un proveedor
                code: 500
      x-quirks:
      - Q08
      - Q09
      x-needs-mock: true
      x-mock-target: Cloudinary (avatar), Google Perspective (provider moderation)
  /usuario/updatePassword:
    post:
      tags:
      - usuario
      summary: Change a password knowing the current one
      description: Identity is again `idUsuario` from the body; the only proof is `passwordActual`. All three fields are required. Business failures
        return 500.
      operationId: usuarioUpdatePassword
      x-source: backend/src/routes/Usuario.php:135
      x-evidence: EJECUTADO
      requestBody:
        required: true
        description: ''
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                idUsuario:
                  type: string
                passwordActual:
                  type: string
                nuevoPassword:
                  type: string
              required:
              - idUsuario
              - passwordActual
              - nuevoPassword
            example:
              idUsuario: '1'
              passwordActual: cliente123
              nuevoPassword: nuevo123
          multipart/form-data:
            schema:
              type: object
              properties:
                idUsuario:
                  type: string
                passwordActual:
                  type: string
                nuevoPassword:
                  type: string
              required:
              - idUsuario
              - passwordActual
              - nuevoPassword
            example:
              idUsuario: '1'
              passwordActual: cliente123
              nuevoPassword: nuevo123
      responses:
        '200':
          description: Contraseña actualizada exitosamente
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/UpdatePasswordData'
              example:
                success: true
                message: Contraseña actualizada exitosamente
                data:
                  success: true
                code: 200
        '400':
          description: Faltan datos
          content:
            application/json:
              example:
                success: false
                message: Faltan datos
                code: 400
        '405':
          description: Método no permitido
          content:
            application/json:
              example:
                success: false
                message: Método no permitido
                code: 405
        '500':
          description: Also 500 'Usuario no encontrado' or 'No se pudo actualizar la contraseña'.
          content:
            application/json:
              example:
                success: false
                message: La contraseña actual es incorrecta
                code: 500
      x-quirks:
      - Q09
  /usuario/getUser:
    get:
      tags:
      - usuario
      summary: Get one user by id (or nothing)
      description: 'Without `id` the controller returns an error, which the route maps to HTTP 500. The response shape branches on whether the
        id exists in `Proveedor`: providers get provider fields plus average rating; clients get the minimal shape. `fecha_nacimiento` is renamed
        from `fechaNac`; `foto_perfil` from `imagen`. Provider `habilidades`/`titulos` are raw rows (`{idProveedor, habilidad}`), not plain strings.'
      operationId: usuarioGetUser
      x-source: backend/src/routes/Usuario.php:167
      x-evidence: EJECUTADO
      parameters:
      - name: id
        in: query
        required: false
        schema:
          type: integer
        description: User id. Optional in the route, but omitting it returns HTTP 500.
        example: 1
      responses:
        '200':
          description: Client or provider profile.
          content:
            application/json:
              schema:
                oneOf:
                - allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UsuarioClientData'
                - allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UsuarioProviderData'
              examples:
                client:
                  value:
                    success: true
                    message: Usuario encontrado
                    data:
                      id: 1
                      nombre: Juan
                      apellido: Perez
                      email: juan@example.com
                      fecha_nacimiento: '1990-01-01'
                      foto_perfil: https://example.com/avatars/juan.png
                      telefono: '+59899111111'
                      esProveedor: false
                    code: 200
                provider:
                  value:
                    success: true
                    message: Usuario encontrado
                    data:
                      id: 2
                      nombre: Maria
                      apellido: Gomez
                      email: maria@example.com
                      fecha_nacimiento: '1985-05-05'
                      foto_perfil: https://example.com/avatars/maria.png
                      telefono: '+59899222222'
                      nombre_empresa: Gomez Servicios
                      descripcion: Plomeria y reparaciones generales
                      experiencia: 5
                      habilidades: []
                      titulos: []
                      esProveedor: true
                      registroMp: false
                      calificacionPromedio: 5
                      totalResenas: 1
                    code: 200
        '405':
          description: Método no permitido
          content:
            application/json:
              example:
                success: false
                message: Método no permitido
                code: 405
        '500':
          description: Also 'ID de usuario no proporcionado' when id is absent.
          content:
            application/json:
              example:
                success: false
                message: Usuario no encontrado
                code: 500
      x-quirks:
      - Q10
      - Q11
  /servicios/getServicio:
    get:
      tags:
      - servicios
      summary: Get one service by id, or the whole catalogue
      description: 'With `id` it returns one detailed service (images/categories/locations/days as string arrays). Without `id` it returns the
        catalogue, each item with `imagen` (first image or `[]`), computed review average and provider first name. An unknown id returns 500 with
        detail ''Servicio no encontrado'': the route checks `$data === null` for 404 but the controller returns an error array, so the 404 branch
        is unreachable. An empty catalogue also returns 500, with detail ''No se encontraron servicios''. Every returned field comes from a separate
        query per item (N+1).'
      operationId: serviciosGetServicio
      x-source: backend/src/routes/Servicio.php:131
      x-evidence: EJECUTADO
      parameters:
      - name: id
        in: query
        required: false
        schema:
          type: integer
        description: Service id. Omit to list the whole catalogue.
        example: 1
      responses:
        '200':
          description: One detailed service or the catalogue list.
          content:
            application/json:
              schema:
                oneOf:
                - allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ServicioDetailData'
                - allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ServicioListItem'
                    required:
                    - data
              examples:
                detail:
                  value:
                    success: true
                    message: Servicio obtenido exitosamente
                    data:
                      id: 1
                      nombre: Plomeria a domicilio
                      precio: 1500
                      idProveedor: 2
                      descripcion: Reparacion de canerias y griferia
                      imagenes:
                      - https://example.com/services/plomeria.jpg
                      categorias:
                      - Plomeria
                      ubicaciones:
                      - Montevideo
                      diasDisponibles:
                      - Lunes
                      - Miercoles
                      nombreProveedor: Maria
                      apellidoProveedor: Gomez
                      imagenProveedor: https://example.com/avatars/maria.png
                    code: 200
                catalogue:
                  value:
                    success: true
                    message: Servicio obtenido exitosamente
                    data:
                    - id: 1
                      nombre: Plomeria a domicilio
                      precio: 1500
                      imagen: https://example.com/services/plomeria.jpg
                      categorias:
                      - Plomeria
                      ubicaciones:
                      - Montevideo
                      diasDisponibles:
                      - Lunes
                      - Miercoles
                      calificacion: 5
                      calificaciones: 1
                      nombre_proveedor: Maria
                    code: 200
        '405':
          description: Método no permitido
          content:
            application/json:
              example:
                success: false
                message: Método no permitido
                code: 405
        '500':
          description: Unknown id (the route 404 branch is unreachable) and empty catalogue (No se encontraron servicios); also any caught exception.
          content:
            application/json:
              example:
                success: false
                message: Error al obtener el servicio
                code: 500
                error: Servicio no encontrado
      x-quirks:
      - Q12
      - Q13
      - Q71
    x-other-actions:
      description: No action match on GET returns 404; other methods return 405.
